# Pre-commit: formatting, lint fixes, secret scan. CI runs the same hooks (.github/workflows/pre-commit.yml).
# Setup: pip install pre-commit && pre-commit install. Bump revs with `pre-commit autoupdate`.
exclude: ^(lib|dist|upload)/|^package-lock\.json$|^CHANGELOG\.md$|^\.pubnub\.yml$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: eslint
        name: eslint --fix (includes prettier) on src
        entry: npx --no-install eslint --fix --config .eslintrc.cjs
        language: system
        files: ^src/.*\.ts$
      - id: prettier
        name: prettier on tests
        entry: npx --no-install prettier --write
        language: system
        files: ^test/.*\.(ts|js)$
      - id: agent-docs
        name: agent harness checks
        entry: .scripts/check-agent-docs.sh
        language: script
        pass_filenames: false
        files: ^(AGENTS\.md|\.agents/|\.scripts/)
